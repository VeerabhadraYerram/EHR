[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-contracts"
version = "0.1.0"
description = "Shared canonical data models, state machines, and events for the EHR Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0"
]
